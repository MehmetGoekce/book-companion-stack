[project]
name = "book-companion-stack"
version = "0.1.1"
description = "Companion code for the book 'Agentic AI in E-Commerce' (Mehmet Gökçe, Leanpub)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Mehmet Gökçe" }]
dependencies = [
    "anthropic>=1.4",
]

[dependency-groups]
dev = [
    "pytest>=9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
